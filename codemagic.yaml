# Codemagic build config generated by Puttimeth's Hacked Drops.
workflows:
  # Unsigned: builds without an Apple account, but iPhones refuse to install it
  # (re-sign with AltStore / Sideloadly). Use ios-adhoc or ios-testflight for installable builds.
  ios-ipa:
    name: "Bundled Page — iOS IPA (unsigned)"
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events: [push]
    scripts:
      - name: Build IPA
        script: bash ios/build-ipa.sh
    artifacts:
      - ios/*.ipa

  # Ad hoc: installs from a link (BetaDrop, Diawi, …) on the iPhones registered in your Apple
  # Developer account (Certificates, IDs & Profiles → Devices, up to 100 per year).
  ios-adhoc:
    name: "Bundled Page — iOS Ad Hoc (registered devices)"
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: "codemagic"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.drop2app.bundledpage
    scripts:
      - name: Use the signing certificate and profile
        script: xcode-project use-profiles
      - name: Give the build a unique build number
        script: |
          cd ios && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: xcode-project build-ipa --project "ios/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa

  # TestFlight: uploads to App Store Connect; any iPhone can install it through TestFlight
  # (internal testers right away, public link after Apple's beta review).
  ios-testflight:
    name: "Bundled Page — iOS TestFlight (any device)"
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: "codemagic"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.drop2app.bundledpage
    scripts:
      - name: Use the signing certificate and profile
        script: xcode-project use-profiles
      - name: Give the build a unique build number
        script: |
          cd ios && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: xcode-project build-ipa --project "ios/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
