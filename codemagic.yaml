# Codemagic build config generated by Puttimeth's Hacked Drops.
workflows:
  ios-ipa:
    name: "Bundled Page — iOS IPA"
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      # The IPA is unsigned. For a signed one that installs on devices, connect an App Store
      # Connect API key in Codemagic, add ios_signing (distribution_type + bundle_identifier
      # com.drop2app.bundledpage), run `xcode-project use-profiles` before the build and set TEAM_ID:
      # https://docs.codemagic.io/yaml-code-signing/signing-ios/
    triggering:
      events: [push]
    scripts:
      - name: Build IPA
        script: bash ios/build-ipa.sh
    artifacts:
      - ios/*.ipa
